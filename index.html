<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-container">
    <h1>My Todo List</h1>
    <p class="subtitle">Keep track of what you need to do.</p>

    <form id="todo-form" action="return false">
      <input id="todo-input" type="text" placeholder="Enter a task..." autocomplete="off" required>
      <button type="submit">Add Task</button>
    </form>

    <div class="filters" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-message">No tasks yet. Add your first task!</p>
    <p id="task-count" class="task-count"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
